<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRACU CGPA Analyzer | Grade Sheet Checker &amp; CGPA Planner</title>
    <meta name="author" content="Faiaz Abrar Zaman Pronoy" />
    <meta name="description" content="BRACU CGPA calculator and planner for BRAC University students. Upload your grade sheet, see which courses to repeat or retake, and plan your way to a higher CGPA." />
    <link rel="canonical" href="https://faiazpronoy.github.io/BRACU-CGPA-Analyzer/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BRACU CGPA Analyzer" />
    <meta property="og:title" content="BRACU CGPA Analyzer | Grade Sheet Checker &amp; CGPA Planner" />
    <meta property="og:description" content="BRACU CGPA calculator and planner for BRAC University students. Upload your grade sheet, see which courses to repeat or retake, and plan your way to a higher CGPA." />
    <meta property="og:url" content="https://faiazpronoy.github.io/BRACU-CGPA-Analyzer/" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "BRACU CGPA Analyzer",
        "alternateName": ["BRACU CGPA Calculator", "BRAC University CGPA Calculator"],
        "url": "https://faiazpronoy.github.io/BRACU-CGPA-Analyzer/",
        "description": "BRACU CGPA calculator and planner for BRAC University students. Upload your grade sheet, see which courses to repeat or retake, and plan your way to a higher CGPA.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BDT" },
        "author": { "@type": "Person", "name": "Faiaz Abrar Zaman Pronoy" }
      }
    </script>
    <meta name="theme-color" content="#FFEFF3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0A16" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // the theme before the first paint, so nothing flashes
      try {
        var t = localStorage.getItem('cgpa-analyzer:theme');
        // what was picked last time, or else what the device prefers
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>BRACU CGPA Analyzer works out your CGPA in the browser, so it needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
