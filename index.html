<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRACU CGPA Analyzer</title>
    <meta name="description" content="An accurate CGPA calculator for BRACU: upload your grade sheet, see your CGPA, plan how to raise it." />
    <meta name="theme-color" content="#1b1e24" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // the theme before the first paint, so nothing flashes
      try {
        var t = localStorage.getItem('cgpa-analyzer:theme') || localStorage.getItem('hisab:theme');
        // dark unless someone picked light: the instrument look is at home there
        if (t !== 'light') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>BRACU CGPA Analyzer works out your CGPA in the browser, so it needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
